<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="oklch(0.560 0.230 265)"/>
  <!-- Git commit nodes (activity graph) -->
  <circle cx="8"  cy="22" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="14" cy="16" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="20" cy="20" r="2.5" fill="white" opacity="0.7"/>
  <circle cx="26" cy="10" r="2.5" fill="white"/>
  <!-- Connecting lines -->
  <line x1="8"  y1="22" x2="14" y2="16" stroke="white" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="14" y1="16" x2="20" y2="20" stroke="white" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="20" y1="20" x2="26" y2="10" stroke="white" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Sparkle dot at top-right -->
  <circle cx="26" cy="10" r="3.5" fill="white" opacity="0.25"/>
</svg>
